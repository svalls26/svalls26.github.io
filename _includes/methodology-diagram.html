<figure class="methodology-figure">
  <div class="methodology-figure__scroll" role="region" aria-label="Research methodology diagram; scroll horizontally on smaller screens" tabindex="0">
    <svg class="methodology-diagram" viewBox="0 0 720 510" role="img" aria-labelledby="methodology-diagram-title methodology-diagram-description" xmlns="http://www.w3.org/2000/svg">
      <title id="methodology-diagram-title">Three-phase research methodology</title>
      <desc id="methodology-diagram-description">Phase I, problem specification: a formative study identifies the expert workflow and confirmation cues, which inform requirements. Workflow findings inform a curated cross-institution join dataset. Phase II, retrieval model development: image acquisition feeds a retrieval pipeline of writing-unit extraction, embedding and aggregation, producing a ranking per classmark. Evaluation on the test fold and held-out codices informs model integration. Phase III, system integration: the model is integrated alongside interface design, guided by the Phase I requirements. Together these produce Genida’at.</desc>

        <marker id="methodology-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0 8 4 0 8Z" fill="#8a7d93"/>
        </marker>
      </defs>

      <g class="methodology-diagram__phase">
        <text x="0" y="39">Phase I</text>
        <text class="methodology-diagram__phase-name" x="0" y="62"><tspan x="0">Problem</tspan><tspan x="0" dy="18">specification</tspan></text>
        <text x="0" y="194">Phase II</text>
        <text class="methodology-diagram__phase-name" x="0" y="217"><tspan x="0">Retrieval model</tspan><tspan x="0" dy="18">development</tspan></text>
        <text x="0" y="376">Phase III</text>
        <text class="methodology-diagram__phase-name" x="0" y="399"><tspan x="0">System</tspan><tspan x="0" dy="18">integration</tspan></text>
      </g>

      </g>

        <rect x="278" y="15" width="159" height="36" rx="4"/>

      <g class="methodology-diagram__output">
        <rect x="479" y="38" width="169" height="41" rx="4"/>
        <text x="563.5" y="64">Requirements</text>
      </g>
      <g class="methodology-diagram__connector" marker-end="url(#methodology-arrow)">
        <path d="M254 58 278 33"/>
        <path d="M254 58 278 84"/>

      <text class="methodology-diagram__note" x="125" y="222">Retrieval pipeline</text>
      <rect class="methodology-diagram__pipeline" x="120" y="230" width="404" height="71" rx="7"/>
      <g class="methodology-diagram__artefact">
        <rect x="132" y="244" width="116" height="42" rx="4"/>

    </svg>
  </div>
  <figcaption><span class="methodology-figure__pan-hint">Scroll sideways to explore the diagram. </span>Three connected phases, from the formative study to Genida’at.</figcaption>
</figure>
